services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: splitfinpulse
      POSTGRES_PASSWORD: splitfinpulse
      POSTGRES_USER: splitfinpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitfinpulse -d splitfinpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
